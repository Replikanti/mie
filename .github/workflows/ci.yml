name: CI

on:
  push:
    branches: [main]
  # Every pull request, deliberately without path filters: `check` and `audit`
  # are meant to be required status checks, and a filtered-out PR would leave
  # them pending forever. `edited` re-runs the issue-link gate when only the
  # PR body changes.
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A cold dependency cache compiles the bundled DuckDB once (#213; the
    # clippy and the test build share its build script) on top of the Rust
    # stack. The 50 min come from 45.7 min measured on four laptop cores
    # while it still compiled twice, which bound the runner (it took
    # 0.50-0.68 of their time); derivation in ADR-057 D8. Since #213: 15.9
    # min on the runner with only DuckDB cold, and clippy 112 min + test
    # 31 min fully cold on a laptop with a 3-core CPU quota shared with
    # other jobs (contended, not comparable to the 45.7 min).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      # Every PR closes its issue ("Closes #N") or states why none applies
      # ("No-Issue: <reason>"). The body goes through an env var, never
      # interpolated into the script (untrusted input).
      - name: PR links an issue
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<<"$PR_BODY"; then
            echo "OK: PR closes an issue"
          elif grep -qE '^No-Issue: .+' <<<"$PR_BODY"; then
            echo "OK: explicit No-Issue exception"
          else
            echo "FAIL: PR body needs 'Closes #N' or a 'No-Issue: <reason>' line"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Architecture rules (ADR-025)
        run: ./tools/check-architecture.sh

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary instead of compiling cargo-deny from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
