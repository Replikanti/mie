# Example configuration for `mie ingest` and `mie capture-report`.
# Public market data needs no credentials. Any future secret is read from
# the environment, never from this file.

[instrument]
# Exchange symbol; also the raw-store instrument segment.
symbol = "BTCUSDT"
# Raw-store source segment.
source = "binance-um"

[paths]
# Root of the raw Parquet store (created on first use).
raw_root = "data/raw"
# Capture journal, JSON Lines, appended to by every run.
journal = "data/capture-journal.jsonl"

[binance]
# USDⓈ-M market-data streams (aggTrade, markPrice, forceOrder, kline) are
# served on the /market route; verified 2026-10-06.
ws_base_url = "wss://fstream.binance.com/market/ws"
# The depth diff stream (btcusdt@depth@100ms) is served on the /public
# route; verified 2026-10-07 (ADR-038).
ws_public_base_url = "wss://fstream.binance.com/public/ws"
rest_base_url = "https://fapi.binance.com"
# Default: all seven. depth (WebSocket diffs) and depthSnapshot (REST
# /fapi/v1/depth) go together: the diffs need snapshots to sync.
streams = [
  "aggTrade", "markPrice", "forceOrder", "kline_1m", "openInterest",
  "depth", "depthSnapshot",
]

# Every key below is optional; the values shown are the defaults.
[capture]
# seal_all cadence: bounds the records a crash can lose (ADR-030 D5).
seal_interval_secs = 300
# Canonical merge hold-back in exchange milliseconds (ADR-028 D6).
hold_back_ms = 2000
# Open interest's REST `time` trails the poll by seconds. A sample late by
# up to this much is delivered at the first open millisecond instead of
# becoming a LateEvent gap (ADR-032 D12). One poll interval.
oi_retime_allowance_ms = 10000
# Planned reconnect of the first stream, before the exchange's 24 h limit;
# each later stream rotates rotation_stagger_secs later.
max_connection_age_secs = 82800
rotation_stagger_secs = 300
ping_interval_secs = 30
liveness_timeout_secs = 90
# Reconnect (ADR-032 D8) and depth-snapshot 418/429 backoff (ADR-038 D3);
# the open-interest poller pauses per ADR-046 instead.
backoff_initial_ms = 250
backoff_max_ms = 30000
# Messages each live channel holds before its sender blocks (ADR-026).
inbound_channel_capacity = 65536
core_channel_capacity = 65536
stats_interval_secs = 60
# Order-book snapshots (ADR-038). A limit=1000 snapshot costs 20 of the
# 2400 REST weight per minute; the spacing caps it at 600/min even while
# resyncs repeat. Checkpoints audit the rebuilt book against a fresh
# snapshot and re-anchor it.
depth_snapshot_limit = 1000
depth_checkpoint_interval_secs = 60
depth_snapshot_min_spacing_ms = 2000
# Event-time cadence of the state checkpoints journaled for the live/replay
# equivalence harness (`mie equivalence`, ADR-041): ordinal, event-stream
# hash and Market State hash, about 1440 lines per day.
state_checkpoint_interval_secs = 60

# The history chain (ADR-052), read by `mie replay --source history`,
# `mie experiment run --source history`, and by `mie ingest`, which
# warm-starts every run that starts at or after the cutover from the chain
# through the run's predecessor while the capture runs (ADR-052 D3, D7).
# Optional: without it every run starts cold (ADR-052 D8).
# [history]
# # The chain's origin and the cutover between the archive and the live
# # runs, UTC dates; 00:00 UTC is implied (ADR-052 D1, D2). The origin is
# # the first day of the archive backfill; the cutover is the first day of
# # continuous capture, with the archive imported through the day before
# # (this date is illustrative).
# origin = "2025-10-01"
# cutover = "2026-11-01"
# # The `mie archive-*` configuration of the archive segment: the same
# # raw_root and symbol as this file.
# archive_config = "archive.toml"
# # The warm start's memory guard (ADR-052 D13): the most records a chain
# # run before the starting one may hold, since the warm-up holds one run
# # in memory at a time; the records queued while it runs share the limit
# # with the largest run. No default: without it every warm start falls back
# # to a cold run, with the reason journaled. The value is the host memory
# # left to the warm-up divided by the bytes per record, both measured by
# # #106; none is given here.
# max_run_records =
