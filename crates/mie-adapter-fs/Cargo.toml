[package]
name = "mie-adapter-fs"
description = "MIE research result store: append-only, read-only result files with SHA-256 trailers (ADR-040)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# An adapter depends on the domain, the ports and external crates, never on
# another adapter (ADR-025). Every external crate is justified below.
[dependencies]
mie-domain.workspace = true
mie-ports.workspace = true
# SHA-256 trailer of every result file: tamper evidence that the 64-bit
# experiment id does not give. Already in the tree (mie-adapter-parquet).
sha2 = "0.11"

[lints]
workspace = true
