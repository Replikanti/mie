[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Replikanti/mie"
publish = false

# Internal crates reference each other by path. Which crate may depend on
# which is fixed by ADR-025 and enforced by tools/check-architecture.sh.
[workspace.dependencies]
mie-domain = { path = "crates/mie-domain" }
mie-ports = { path = "crates/mie-ports" }
mie-app = { path = "crates/mie-app" }
mie-adapter-binance = { path = "crates/mie-adapter-binance" }
mie-adapter-parquet = { path = "crates/mie-adapter-parquet" }
mie-adapter-fs = { path = "crates/mie-adapter-fs" }
mie-adapter-duckdb = { path = "crates/mie-adapter-duckdb" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Debug test builds optimize the domain crate only. The engine replays
# multi-day tapes in many tests (the 45-day candidate golden tape, the
# structure and liquidity goldens), and since #22 M3 every replayed minute
# judges three windows against 1 440-value baselines. Measured on four
# cores, `cargo test --workspace`: opt-level 0 builds the workspace crates in
# 43 s and runs the tests in 687 s; 2 builds in 79 s and runs in 56 s; 1
# (100 s, 60 s) and 3 (106 s, 56 s) are no better. The test profile inherits
# this; overflow checks and debug assertions stay on, so the tests check the
# same arithmetic.
[profile.dev.package.mie-domain]
opt-level = 2

# The bundled DuckDB of mie-adapter-duckdb (ADR-057 D8), compiled from C++
# by its build script. Measured with four cores (-j4, CPUQuota=400%, the
# CI runner's vCPUs):
# - opt-level 0 builds it alone cold in 790 s and leaves a 701 MB static
#   library (2.7 GB of target/); 2 in 1 225 s and 163 MB (1.3 GB). Rebuilt
#   under the mie-cli tests, 1 took 1 016 s (162 MB) and 2 took 1 518 s.
# - The DuckDB-bound test (`views_are_identical_at_one_and_four_threads`,
#   25 000 decisions) ran 92 s at 0, 59 s at 1 and 50 s at 2.
# 1 builds 502 s faster than 2 under the same conditions with nearly its
# test speed; against 0 it cuts the library that every CI cache entry
# carries from 701 to 162 MB and the DuckDB-bound test by a third.
# `debug = false` keeps DWARF out of the C++ objects and defines NDEBUG, so
# DuckDB's debug-only verification paths stay off in tests.
[profile.dev.package.libduckdb-sys]
debug = false
opt-level = 1
