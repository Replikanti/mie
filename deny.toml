# cargo-deny policy, run by the `audit` CI job.
# Widening the license list or adding an exception is a conscious decision:
# record the reason next to the entry, in the PR that needs it.

[graph]
# Dev-only tooling may be looser; what ships may not.
exclude-dev = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
]
# Per-crate exceptions, each with the dependency path that pulls it in. The
# global allow list stays MIT/Apache-2.0. The first two come with the Arrow
# stack under mie-adapter-parquet (ADR-030).
exceptions = [
    # CC0-1.0 (public-domain dedication): ahash -> const-random ->
    # const-random-macro -> tiny-keccak, compile-time random seed only.
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
    # Unicode-3.0 (permissive data license): proc-macro2 -> unicode-ident,
    # a build-time dependency of the proc macros in the Arrow tree.
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
    # The rustls TLS stack under mie-adapter-binance (#9), with the ring
    # crypto provider and the operating system's root store (no
    # webpki-roots bundle, no aws-lc-rs C build).
    # ISC (permissive, MIT-equivalent): ring is "Apache-2.0 AND ISC", its
    # BoringSSL-derived code carries ISC.
    { allow = ["ISC"], crate = "ring" },
    # ISC: ring -> untrusted, safe parsing of untrusted DER input.
    { allow = ["ISC"], crate = "untrusted" },
    # ISC: rustls -> rustls-webpki, certificate path validation.
    { allow = ["ISC"], crate = "rustls-webpki" },
    # BSD-3-Clause (permissive): rustls -> subtle, constant-time comparisons.
    # Every rustls build depends on it, whatever the crypto provider.
    { allow = ["BSD-3-Clause"], crate = "subtle" },
    # The DuckDB engine under mie-adapter-duckdb (#27, ADR-057 D8).
    # Zlib (permissive, OSI-approved, no attribution in binaries):
    # duckdb -> hashlink -> hashbrown -> foldhash, the default hasher of the
    # hash map behind duckdb's prepared-statement cache. The C++ code the
    # bundled build compiles is invisible to cargo deny; ADR-057 D8 lists
    # its licenses.
    { allow = ["Zlib"], crate = "foldhash" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates reference each other by path without a version. They are
# private (publish = false), so path wildcards are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
