# cargo-deny policy, run by the `audit` CI job.
# Widening the license list or adding an exception is a conscious decision:
# record the reason next to the entry, in the PR that needs it.

[graph]
# Dev-only tooling may be looser; what ships may not.
exclude-dev = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
]
# Per-crate exceptions, each pulled in by the Arrow stack under
# mie-adapter-parquet (ADR-030). The global allow list stays MIT/Apache-2.0.
exceptions = [
    # CC0-1.0 (public-domain dedication): ahash -> const-random ->
    # const-random-macro -> tiny-keccak, compile-time random seed only.
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
    # Unicode-3.0 (permissive data license): proc-macro2 -> unicode-ident,
    # a build-time dependency of the proc macros in the Arrow tree.
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates reference each other by path without a version. They are
# private (publish = false), so path wildcards are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
